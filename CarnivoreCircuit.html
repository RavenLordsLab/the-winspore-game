<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Carnivore Circuit</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a1f0a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Arial Black', Arial, sans-serif;
  }
  #title {
    color: #66FF66;
    font-size: 26px;
    letter-spacing: 6px;
    text-shadow: 0 0 24px #66FF6688, 0 0 4px #FF2222;
    margin-bottom: 8px;
  }
  canvas {
    border: 2px solid #66FF6644;
    box-shadow: 0 0 40px #66FF661a;
    display: block;
  }
</style>
</head>
<body>
<div id="title">&#x1F3C1; CARNIVORE CIRCUIT &#x1F3C1;</div>
<canvas id="c"></canvas>
<script>
// =========================================================
//  CARNIVORE CIRCUIT  |  Road Race  |  5 AI  |  10 Laps
//  Venus flytraps in the asphalt snap at your tires.
// =========================================================
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
canvas.width  = 920;
canvas.height = 490;
const W = canvas.width, H = canvas.height;

// -- Layout -----------------------------------------------
const ROAD_TOP = 170, ROAD_BOT = 440;
const ROAD_H   = ROAD_BOT - ROAD_TOP;
const N_LANES  = 4;
const LANE_H   = ROAD_H / N_LANES;
const PLAYER_X = 160;
const CAR_W    = 78, CAR_H = 36;

// -- Constants --------------------------------------------
const TRACK_LEN  = 6000;
const N_LAPS     = 10;
const POS_SCALE  = 0.12;
const ROAD_RATE  = 1.8;

// -- State ------------------------------------------------
let scrollX    = 0;
let raceTime   = 0;
let gameState  = 'countdown';
let countdown  = 3;
let cdTimer    = 0;
let winnerName = '';
let finishTime = 0;
let lastLaneTm = 0;

// -- Player -----------------------------------------------
const P = {
  name: 'YOU', color: '#00DDFF', num: '7',
  lane: 1, speed: 0,
  maxSpd: 16, accel: 0.34, brake: 0.55, friction: 0.09,
  dist: 0, lap: 1, finished: false,
  grabTimer: 0
};

// -- AI Definitions ---------------------------------------
const AI_DEF = [
  { name: 'RED', color: '#FF3333', num: '3',  baseSpd: 13.4, startDist: -350, lane: 0 },
  { name: 'GRN', color: '#44DD44', num: '11', baseSpd: 14.2, startDist: -600, lane: 2 },
  { name: 'YEL', color: '#FFCC00', num: '22', baseSpd: 12.9, startDist: -900, lane: 3 },
  { name: 'PNK', color: '#FF55FF', num: '5',  baseSpd: 14.6, startDist: -450, lane: 1 },
  { name: 'ORG', color: '#FF8800', num: '18', baseSpd: 13.7, startDist: -750, lane: 0 },
];

// -- Venus Flytraps ---------------------------------------
// They LOOK like plants sprouting from cracks in the asphalt,
// but they're mechanical tire-grabbers that chomp down on wheels.
const TRAPS = [
  { lapDist:  700, lane: 0 }, { lapDist:  700, lane: 2 },
  { lapDist: 1400, lane: 1 }, { lapDist: 1400, lane: 3 },
  { lapDist: 2100, lane: 0 }, { lapDist: 2100, lane: 1 },
  { lapDist: 2900, lane: 2 },
  { lapDist: 3600, lane: 1 }, { lapDist: 3600, lane: 3 },
  { lapDist: 4300, lane: 0 }, { lapDist: 4300, lane: 3 },
  { lapDist: 5000, lane: 1 }, { lapDist: 5000, lane: 2 },
  { lapDist: 5600, lane: 3 },
];
TRAPS.forEach(t => { t.snapTimer = 0; t.sway = Math.random() * Math.PI * 2; });

function trapOpenness(t) {
  if (t <= 0)   return 1;
  if (t > 1.05) return (1.2 - t) / 0.15;
  if (t > 0.35) return 0;
  return 1 - t / 0.35;
}

// -- Cannonballs ------------------------------------------
let cannonballs      = [];
let cannonPuffs      = [];
let cannonSpawnTimer = 3.0;
let cannonHitTimer   = 0;
const CANNON_SPEED    = 480;
const CANNON_INTERVAL = 2.6;

function spawnCannonball() {
  const lane     = Math.floor(Math.random() * N_LANES);
  const fromLeft = Math.random() > 0.5;
  cannonballs.push({ x: fromLeft ? -28 : W + 28, lane, vx: fromLeft ? CANNON_SPEED : -CANNON_SPEED });
  cannonPuffs.push({ x: fromLeft ? 0 : W, y: laneY(lane), timer: 0.5 });
}

let ais;
function initAIs() {
  ais = AI_DEF.map(d => ({
    ...d, speed: d.baseSpd,
    dist: d.startDist, lap: 1,
    finished: false,
    laneTm: Math.random() * 2.5,
    grabTimer: 0
  }));
}
initAIs();

// -- Trackside scenery: grandstands, flags, pit wall ------
const SCENE = Array.from({ length: 90 }, (_, i) => {
  const r = Math.random();
  return {
    gx:   i * 130 + (Math.random() * 50 - 25),
    top:  Math.random() > 0.45,
    kind: r > 0.55 ? 'stand' : (r > 0.3 ? 'flag' : (r > 0.15 ? 'tree' : 'sign')),
    sz:   22 + Math.random() * 20,
    hue:  Math.floor(Math.random() * 360)
  };
});

// -- Input ------------------------------------------------
const K = {};
window.addEventListener('keydown', e => { K[e.code] = true;  e.preventDefault(); });
window.addEventListener('keyup',   e => { K[e.code] = false; });

// -- Helpers ----------------------------------------------
const laneY    = l   => ROAD_TOP + LANE_H * l + LANE_H / 2;
const totalDst = obj => (obj.lap - 1) * TRACK_LEN + obj.dist;
const clamp    = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

function ordinal(n) {
  const s = ['th','st','nd','rd'], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

function getPos() {
  let p = 1;
  const pd = totalDst(P);
  ais.forEach(ai => { if (totalDst(ai) > pd) p++; });
  return p;
}

function tryFinish(entity, name) {
  if (!entity.finished) {
    entity.finished = true;
    if (gameState === 'racing') {
      winnerName = name;
      finishTime = raceTime;
      gameState  = 'finished';
    }
  }
}

// -- Draw: Background -------------------------------------
function drawBg() {
  // Daytime sky
  const sg = ctx.createLinearGradient(0, 0, 0, ROAD_TOP);
  sg.addColorStop(0, '#4aa3e6');
  sg.addColorStop(1, '#bfe2f5');
  ctx.fillStyle = sg;
  ctx.fillRect(0, 0, W, ROAD_TOP);

  // Sun
  ctx.fillStyle = '#FFF2AA';
  ctx.beginPath();
  ctx.arc(780, 46, 26, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,220,120,0.35)';
  ctx.beginPath();
  ctx.arc(780, 46, 40, 0, Math.PI * 2);
  ctx.fill();

  // Clouds (stable, slow parallax)
  for (let i = 0; i < 6; i++) {
    const base = i * 220 + 60;
    const cx   = ((base - scrollX * 0.04) % 1320 + 1320) % 1320 - 100;
    const cy   = 30 + (i % 3) * 24;
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    ctx.arc(cx,      cy, 18, 0, Math.PI * 2);
    ctx.arc(cx + 22, cy - 5, 22, 0, Math.PI * 2);
    ctx.arc(cx + 46, cy, 16, 0, Math.PI * 2);
    ctx.arc(cx + 34, cy + 8, 18, 0, Math.PI * 2);
    ctx.fill();
  }

  // Distant hills
  ctx.fillStyle = '#3a6a3a';
  for (let i = 0; i < 8; i++) {
    const base = i * 160;
    const sx   = ((base - scrollX * 0.09) % 1280 + 1280) % 1280;
    const ht   = 38 + (i % 3) * 22;
    ctx.beginPath();
    ctx.moveTo(sx - 90, ROAD_TOP - 20);
    ctx.lineTo(sx,      ROAD_TOP - ht);
    ctx.lineTo(sx + 90, ROAD_TOP - 20);
    ctx.fill();
  }

  // Trackside grass
  ctx.fillStyle = '#3f8a3f';
  ctx.fillRect(0, ROAD_TOP - 20, W, 20);
  ctx.fillRect(0, ROAD_BOT,      W, H - ROAD_BOT);

  // Grass stripe pattern (mowed lines)
  ctx.fillStyle = 'rgba(255,255,255,0.05)';
  const stripePer = 70;
  const so = scrollX % stripePer;
  for (let x = -stripePer + so; x < W + stripePer; x += stripePer) {
    ctx.fillRect(x, ROAD_BOT + 4, stripePer / 2, H - ROAD_BOT - 8);
  }
}

// -- Draw: Road -------------------------------------------
function drawRoad() {
  // Asphalt
  ctx.fillStyle = '#2e2e32';
  ctx.fillRect(0, ROAD_TOP, W, ROAD_H);

  // Red/white kerbs (rumble strips)
  const rw = 18, rp = rw * 2;
  const ro = scrollX % rp;
  for (let x = -rp + ro; x < W + rp; x += rp) {
    ctx.fillStyle = '#E11';
    ctx.fillRect(x,      ROAD_TOP - 18, rw, 18);
    ctx.fillRect(x + rw, ROAD_TOP - 18, rw, 18);
    ctx.fillStyle = '#fff';
    ctx.fillRect(x + rw, ROAD_TOP - 18, rw, 18);

    ctx.fillStyle = '#E11';
    ctx.fillRect(x,      ROAD_BOT, rw, 18);
    ctx.fillStyle = '#fff';
    ctx.fillRect(x + rw, ROAD_BOT, rw, 18);
  }

  // Dashed lane dividers
  const dashLen = 55, dashGap = 40, period = dashLen + dashGap;
  const off = scrollX % period;
  ctx.setLineDash([dashLen, dashGap]);
  ctx.lineDashOffset = -off;
  ctx.strokeStyle = 'rgba(255,255,255,0.55)';
  ctx.lineWidth = 2;
  for (let l = 1; l < N_LANES; l++) {
    const y = ROAD_TOP + LANE_H * l;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // Solid road edges
  ctx.strokeStyle = '#ddd';
  ctx.lineWidth = 3;
  [ROAD_TOP, ROAD_BOT].forEach(y => {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  });

  // Speed streaks
  if (P.speed > 2) {
    const intensity = clamp(P.speed / P.maxSpd, 0, 1);
    const nStreaks = Math.floor(14 + intensity * 22);
    for (let i = 0; i < nStreaks; i++) {
      const seed   = (i * 197.3 + scrollX * 0.6) % 1;
      const sy     = ROAD_TOP + 6 + seed * (ROAD_H - 12);
      const len    = 60 + intensity * 140 + (i % 5) * 20;
      const sxBase = (i * 313.7 - scrollX * (1.4 + intensity * 2.2)) % (W + 220);
      const sx     = ((sxBase % (W + 220)) + (W + 220)) % (W + 220) - 110;
      const alpha  = 0.10 + intensity * 0.35 * (0.4 + (i % 3) * 0.2);
      ctx.fillStyle = `rgba(230,230,255,${alpha})`;
      ctx.fillRect(sx, sy, len, 1.5);
    }
  }
}

// -- Draw: Trackside scenery ------------------------------
function drawScenery() {
  const period = 90 * 130;
  SCENE.forEach(s => {
    const sx = ((s.gx - scrollX * 0.82) % period + period) % period - 100;
    if (sx < -80 || sx > W + 80) return;
    const by   = s.top ? ROAD_TOP - 20 : ROAD_BOT;
    const flip = s.top ? -1 : 1;

    if (s.kind === 'stand') {
      // Grandstand with spectators
      const gw = 58, gh = 24;
      const gx = sx - gw / 2;
      const gy = by + flip * (gh + 8);
      // Roof
      ctx.fillStyle = '#444';
      ctx.fillRect(gx - 4, gy, gw + 8, 5);
      // Tiers
      ctx.fillStyle = '#888';
      ctx.fillRect(gx, gy + 5, gw, gh - 5);
      // Crowd dots
      for (let i = 0; i < 10; i++) {
        ctx.fillStyle = `hsl(${(s.hue + i * 37) % 360}, 60%, 55%)`;
        ctx.fillRect(gx + 3 + i * 5, gy + 7 + (i % 3) * 5, 3, 4);
      }
      // Supports
      ctx.fillStyle = '#333';
      ctx.fillRect(gx + 4, gy + gh, 3, 6);
      ctx.fillRect(gx + gw - 7, gy + gh, 3, 6);
    } else if (s.kind === 'flag') {
      // Checkered / colored flag on pole
      const pt = s.sz * 1.1;
      ctx.fillStyle = '#2a2a2a';
      ctx.fillRect(sx - 1, by, 2, flip * pt);
      // Flag
      ctx.save();
      ctx.translate(sx, by + flip * pt);
      const wav = Math.sin(raceTime * 3 + s.sway) * 2;
      if (s.hue < 120) {
        // checkered
        for (let r = 0; r < 3; r++) {
          for (let c = 0; c < 4; c++) {
            ctx.fillStyle = (r + c) % 2 === 0 ? '#000' : '#fff';
            ctx.fillRect(2 + c * 4, r * 4 + wav * (c * 0.2), 4, 4);
          }
        }
      } else {
        ctx.fillStyle = `hsl(${s.hue}, 80%, 55%)`;
        ctx.beginPath();
        ctx.moveTo(2, 0);
        ctx.lineTo(20, wav);
        ctx.lineTo(20, 12 + wav);
        ctx.lineTo(2, 12);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    } else if (s.kind === 'tree') {
      ctx.fillStyle = '#4a2008';
      ctx.fillRect(sx - 3, by, 6, flip * s.sz * 0.4);
      ctx.fillStyle = '#2a7a2a';
      ctx.beginPath();
      ctx.arc(sx, by + flip * s.sz * 0.45, s.sz * 0.55, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // Track sign
      ctx.fillStyle = '#888';
      ctx.fillRect(sx - 1, by, 2, flip * s.sz * 0.8);
      ctx.fillStyle = `hsl(${s.hue}, 70%, 50%)`;
      ctx.fillRect(sx - 14, by + flip * s.sz * 0.8 - (flip > 0 ? 0 : 14), 28, 14);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 9px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(['GO!', 'TURN', 'PIT', 'SPD'][s.hue % 4], sx, by + flip * s.sz * 0.8 - (flip > 0 ? -10 : 4));
    }
  });
}

// -- Draw: Cannonballs ------------------------------------
function drawCannonballs() {
  cannonPuffs.forEach(p => {
    const a = p.timer * 2;
    const r = 28 * (1 - p.timer * 1.5) + 10;
    ctx.fillStyle = `rgba(220,180,80,${a * 0.7})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = `rgba(255,255,200,${a * 0.5})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r * 0.5, 0, Math.PI * 2);
    ctx.fill();
  });

  cannonballs.forEach(b => {
    const cx = b.x, cy = laneY(b.lane), r = 13;
    const trailDir = b.vx > 0 ? -1 : 1;

    for (let i = 1; i <= 5; i++) {
      ctx.fillStyle = `rgba(160,140,100,${0.18 - i * 0.03})`;
      ctx.beginPath();
      ctx.arc(cx + trailDir * i * 16, cy + (Math.random() - 0.5) * 4, r - i * 1.5, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.ellipse(cx + 4, cy + r + 4, r * 0.75, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    const gr = ctx.createRadialGradient(cx - r * 0.35, cy - r * 0.35, r * 0.05, cx, cy, r);
    gr.addColorStop(0,   '#999');
    gr.addColorStop(0.4, '#333');
    gr.addColorStop(1,   '#0a0a0a');
    ctx.fillStyle = gr;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,0.38)';
    ctx.beginPath();
    ctx.arc(cx - r * 0.32, cy - r * 0.32, r * 0.32, 0, Math.PI * 2);
    ctx.fill();

    const fx = cx + trailDir * (r - 2);
    const fg = ctx.createRadialGradient(fx, cy, 0, fx, cy, 10);
    fg.addColorStop(0,   '#FFFF88');
    fg.addColorStop(0.4, '#FF8800');
    fg.addColorStop(1,   'rgba(255,80,0,0)');
    ctx.fillStyle = fg;
    ctx.beginPath();
    ctx.arc(fx, cy, 12, 0, Math.PI * 2);
    ctx.fill();
  });

  if (cannonHitTimer > 0.25) {
    const scale = 1 + (1 - cannonHitTimer) * 1.5;
    ctx.save();
    ctx.translate(PLAYER_X, laneY(P.lane) - 50);
    ctx.scale(scale, scale);
    ctx.fillStyle = `rgba(255,200,0,${cannonHitTimer * 1.5})`;
    ctx.font = 'bold 36px Arial Black, Arial';
    ctx.textAlign = 'center';
    ctx.fillText('BOOM!', 0, 0);
    ctx.restore();
  }
}

// -- Draw: Venus Flytrap ----------------------------------
function drawFlytrap(cx, cy, openness, sway) {
  // Cracked asphalt around the base
  ctx.fillStyle = 'rgba(10,10,10,0.55)';
  ctx.beginPath();
  ctx.ellipse(cx, cy + 14, 18, 4, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#111';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx - 14, cy + 13); ctx.lineTo(cx - 4, cy + 15);
  ctx.moveTo(cx + 14, cy + 13); ctx.lineTo(cx + 5, cy + 16);
  ctx.stroke();

  // Base leaves
  ctx.fillStyle = '#1f5a1f';
  ctx.beginPath();
  ctx.ellipse(cx - 12, cy + 12, 12, 4, -0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(cx + 12, cy + 12, 12, 4, 0.3, 0, Math.PI * 2);
  ctx.fill();

  // Stem (slight sway when open)
  const stemBend = openness > 0.5 ? Math.sin(sway) * 1.5 : 0;
  ctx.strokeStyle = '#2a7a2a';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx, cy + 12);
  ctx.quadraticCurveTo(cx + stemBend, cy + 2, cx + stemBend, cy - 6);
  ctx.stroke();
  ctx.lineCap = 'butt';

  const jx = cx + stemBend;
  const jy = cy - 6;

  // Two jaws: rotate from closed (vertical pointing up together) to open (V-shape)
  // openness 1 = wide apart, 0 = together
  const jawLen   = 22;
  const openAng  = 0.95;           // max spread angle (radians)
  const ang      = openAng * openness;

  for (let side = -1; side <= 1; side += 2) {
    const a = side * ang;
    const tipX = jx + Math.sin(a) * jawLen;
    const tipY = jy - Math.cos(a) * jawLen;

    // Jaw outer shell (green)
    ctx.save();
    ctx.translate(jx, jy);
    ctx.rotate(a);

    // Outer curved jaw
    ctx.fillStyle = side > 0 ? '#3a9a3a' : '#2f8a2f';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(side * 14, -jawLen * 0.4, side * 8, -jawLen);
    ctx.quadraticCurveTo(side * 2, -jawLen * 0.5, 0, 0);
    ctx.closePath();
    ctx.fill();

    // Pink/red interior (only visible when open)
    if (openness > 0.05) {
      ctx.fillStyle = '#c21818';
      ctx.globalAlpha = openness;
      ctx.beginPath();
      ctx.moveTo(0, -1);
      ctx.quadraticCurveTo(side * 10, -jawLen * 0.45, side * 5, -jawLen + 2);
      ctx.quadraticCurveTo(side * 2, -jawLen * 0.5, 0, -1);
      ctx.closePath();
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // Teeth along the inner edge
    const nTeeth = 5;
    ctx.fillStyle = '#f4f4ec';
    ctx.strokeStyle = '#888';
    ctx.lineWidth = 0.6;
    for (let i = 0; i < nTeeth; i++) {
      const t = 0.12 + i / (nTeeth - 0.5) * 0.85;
      const tx = side * (t * 3);
      const ty = -t * jawLen;
      ctx.beginPath();
      ctx.moveTo(tx - 1.2, ty);
      ctx.lineTo(tx + side * 2.2, ty + 0.5);
      ctx.lineTo(tx - 0.2, ty + 3.2);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }

    // Jaw outline
    ctx.strokeStyle = '#0d3a0d';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(side * 14, -jawLen * 0.4, side * 8, -jawLen);
    ctx.stroke();

    ctx.restore();

    // Spots on outer jaw surface (decorative)
    const spotX = jx + Math.sin(a * 0.5) * 6;
    const spotY = jy - Math.cos(a * 0.5) * 10;
    ctx.fillStyle = 'rgba(20,60,20,0.5)';
    ctx.beginPath();
    ctx.arc(spotX + side * 2, spotY, 1.8, 0, Math.PI * 2);
    ctx.fill();
  }

  // Warning glow when open & nearby
  if (openness > 0.7) {
    const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, 36);
    grd.addColorStop(0, 'rgba(255,50,50,0.18)');
    grd.addColorStop(1, 'rgba(255,50,50,0)');
    ctx.fillStyle = grd;
    ctx.fillRect(cx - 36, cy - 36, 72, 72);
  }
}

function drawTraps() {
  const pd = P.dist;
  TRAPS.forEach(trap => {
    const openness = trapOpenness(trap.snapTimer);
    for (let lapOff = -1; lapOff <= 1; lapOff++) {
      const distFromPlayer = trap.lapDist + lapOff * TRACK_LEN - pd;
      const sx = PLAYER_X + distFromPlayer * POS_SCALE;
      if (sx < -40 || sx > W + 40) continue;

      const sy = laneY(trap.lane) + 6;
      drawFlytrap(sx, sy, openness, trap.sway + raceTime * 1.8);

      if (distFromPlayer > 0 && distFromPlayer < 700 && openness > 0.5) {
        const alpha = Math.min(1, (700 - distFromPlayer) / 400);
        ctx.fillStyle = `rgba(255, 60, 60, ${alpha * 0.9})`;
        ctx.font = 'bold 10px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('\u26A0 BITE!', sx, sy - 34);
      }
    }
  });
}

// -- Draw: Finish Line ------------------------------------
function drawFinishLine() {
  const dist2go = TRACK_LEN - P.dist;
  if (dist2go < 0) return;
  const fx = PLAYER_X + dist2go * POS_SCALE;
  if (fx < -50 || fx > W + 50) return;

  const tSz = 22;
  for (let col = 0; col < 3; col++) {
    for (let row = 0; row <= Math.ceil(ROAD_H / tSz); row++) {
      ctx.fillStyle = (col + row) % 2 === 0 ? '#000' : '#fff';
      ctx.fillRect(fx - 33 + col * tSz, ROAD_TOP + row * tSz, tSz, tSz);
    }
  }

  // Start/finish gantry
  if (fx > -40 && fx < W + 40) {
    ctx.fillStyle = '#111';
    ctx.fillRect(fx - 40, ROAD_TOP - 46, 80, 6);
    ctx.fillRect(fx - 42, ROAD_TOP - 46, 4, 26);
    ctx.fillRect(fx + 38, ROAD_TOP - 46, 4, 26);
    ctx.fillStyle = '#FFCC00';
    ctx.font = 'bold 13px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('FINISH', fx, ROAD_TOP - 30);
  }
}

// -- Draw: Car (race car with wings & open wheels) --------
function drawCar(x, y, color, isPlayer, name, num, grabbed) {
  const hw = CAR_W / 2, hh = CAR_H / 2;
  const lx = x - hw, rx = x + hw;

  // Drop shadow
  ctx.fillStyle = 'rgba(0,0,0,0.38)';
  ctx.beginPath();
  ctx.ellipse(x + 4, y + hh + 5, hw * 0.85, 7, 0, 0, Math.PI * 2);
  ctx.fill();

  // Rear wing (left side = rear)
  ctx.fillStyle = '#181818';
  ctx.fillRect(lx - 4, y - hh - 2, 6, CAR_H + 4);
  ctx.fillStyle = color;
  ctx.fillRect(lx - 4, y - hh - 1, 6, 2);
  ctx.fillRect(lx - 4, y + hh - 3, 6, 2);

  // Rear wing endplates
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(lx - 5, y - hh - 3, 3, CAR_H + 6);

  // Front wing (right = front)
  ctx.fillStyle = '#181818';
  ctx.fillRect(rx - 2, y - hh - 3, 8, CAR_H + 6);
  ctx.fillStyle = color;
  ctx.fillRect(rx - 2, y - hh - 2, 8, 2);
  ctx.fillRect(rx - 2, y + hh, 8, 2);

  // Side pods + main chassis (pointy nose to the right)
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(lx + 6, y - hh + 4);
  ctx.lineTo(rx - 6, y - hh + 8);
  ctx.lineTo(rx + 2, y);
  ctx.lineTo(rx - 6, y + hh - 8);
  ctx.lineTo(lx + 6, y + hh - 4);
  ctx.closePath();
  ctx.fill();

  // Darker racing stripe down the middle
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.fillRect(lx + 8, y - 3, CAR_W - 18, 6);

  // Open wheels (4) - drawn outside the body
  const wheels = [
    [lx + 10, y - hh - 6],
    [rx - 20, y - hh - 6],
    [lx + 10, y + hh - 4],
    [rx - 20, y + hh - 4]
  ];
  wheels.forEach(([wx, wy], i) => {
    const wobble = grabbed && i >= 2 ? Math.sin(raceTime * 40) * 0.5 : 0;
    ctx.fillStyle = '#0d0d0d';
    ctx.beginPath();
    ctx.ellipse(wx + 6, wy + 5 + wobble, 8, 5.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#3a3a3a';
    ctx.beginPath();
    ctx.ellipse(wx + 6, wy + 5 + wobble, 4, 3, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#666';
    ctx.lineWidth = 0.7;
    ctx.beginPath();
    ctx.moveTo(wx + 2, wy + 5 + wobble); ctx.lineTo(wx + 10, wy + 5 + wobble);
    ctx.moveTo(wx + 6, wy + 2 + wobble); ctx.lineTo(wx + 6, wy + 8 + wobble);
    ctx.stroke();
  });

  // Cockpit (tinted bubble)
  ctx.fillStyle = 'rgba(30,40,60,0.82)';
  ctx.beginPath();
  ctx.ellipse(x + 4, y, 14, 7, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(180,220,255,0.45)';
  ctx.beginPath();
  ctx.ellipse(x + 2, y - 2, 9, 3, 0, 0, Math.PI * 2);
  ctx.fill();

  // Helmet dot inside cockpit
  ctx.fillStyle = isPlayer ? '#fff' : '#eee';
  ctx.beginPath();
  ctx.arc(x + 4, y, 3, 0, Math.PI * 2);
  ctx.fill();

  // Racing number on side
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 11px Arial Black';
  ctx.textAlign = 'center';
  ctx.fillText(num, x - 14, y + 4);

  // Name tag
  ctx.fillStyle = isPlayer ? '#00DDFF' : '#fff';
  ctx.font = 'bold 11px monospace';
  ctx.textAlign = 'center';
  ctx.shadowColor = '#000';
  ctx.shadowBlur = 4;
  ctx.fillText(name, x, y - hh - 12);
  ctx.shadowBlur = 0;

  // Exhaust flames (rear = left)
  for (let i = 0; i < 3; i++) {
    const fl = 7 - i * 1.5;
    ctx.fillStyle = `rgba(255,${120 + i * 40},${i * 30},${0.75 - i * 0.22})`;
    ctx.beginPath();
    ctx.ellipse(lx - 6 - i * 5, y + (i - 1) * 5, fl, 2.5, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // Speed lines
  for (let i = 0; i < 4; i++) {
    const yOff = (i - 1.5) * 7;
    ctx.fillStyle = `rgba(255,255,255,${0.35 - i * 0.06})`;
    ctx.fillRect(lx - 14 - i * 18, y + yOff, 22 + i * 6, 1.4);
  }
}

// -- Draw: HUD --------------------------------------------
function drawHUD() {
  ctx.fillStyle = 'rgba(0,0,0,0.78)';
  ctx.beginPath();
  ctx.roundRect(10, 10, 205, 195, 8);
  ctx.fill();
  ctx.strokeStyle = '#66FF66';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.roundRect(10, 10, 205, 195, 8);
  ctx.stroke();

  const spd  = Math.round(P.speed * 24);
  const rows = [
    `SPEED  ${String(spd).padStart(3)} km/h`,
    `LAP    ${clamp(P.lap, 1, N_LAPS)} / ${N_LAPS}`,
    `POS    ${ordinal(getPos())} of ${ais.length + 1}`,
    `TIME   ${raceTime.toFixed(1)}s`,
  ];
  ctx.fillStyle = '#66FF66';
  ctx.font = 'bold 13px monospace';
  ctx.textAlign = 'left';
  rows.forEach((r, i) => ctx.fillText(r, 22, 42 + i * 26));

  ctx.fillStyle = '#888';
  ctx.font = '10px monospace';
  ctx.fillText('THROTTLE', 22, 152);

  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(10, 156, 205, 9);
  const pct = P.speed / P.maxSpd;
  ctx.fillStyle = pct > 0.85 ? '#ff0' : pct > 0.5 ? '#0f0' : '#08f';
  ctx.fillRect(10, 156, pct * 205, 9);

  ctx.fillStyle = '#888';
  ctx.font = '10px monospace';
  ctx.textAlign = 'left';
  ctx.fillText('LAP PROGRESS', 22, 178);

  const mmX = 10, mmY = 180, mmW = 205, mmH = 13;
  ctx.fillStyle = '#111';
  ctx.fillRect(mmX, mmY, mmW, mmH);
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1;
  ctx.strokeRect(mmX, mmY, mmW, mmH);

  ais.forEach(ai => {
    const p = ((ai.dist % TRACK_LEN) + TRACK_LEN) % TRACK_LEN / TRACK_LEN;
    ctx.fillStyle = ai.color;
    ctx.fillRect(mmX + p * mmW - 2, mmY + 2, 4, mmH - 4);
  });
  const pp = (P.dist % TRACK_LEN) / TRACK_LEN;
  ctx.fillStyle = '#00DDFF';
  ctx.fillRect(mmX + pp * mmW - 3, mmY, 6, mmH);

  // Trap markers on minimap
  TRAPS.forEach(t => {
    const tp = t.lapDist / TRACK_LEN;
    ctx.fillStyle = 'rgba(60,220,60,0.8)';
    ctx.fillRect(mmX + tp * mmW - 1, mmY + mmH - 3, 2, 3);
  });

  // GRABBED banner
  if (P.grabTimer > 0) {
    ctx.fillStyle = `rgba(200,20,20,${0.6 + Math.sin(raceTime * 20) * 0.25})`;
    ctx.font = 'bold 22px Arial Black';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#000';
    ctx.shadowBlur = 6;
    ctx.fillText('\u{1F33F} TIRE GRABBED!', W / 2, 90);
    ctx.shadowBlur = 0;
  }

  ctx.fillStyle = 'rgba(255,255,255,0.38)';
  ctx.font = '11px Arial';
  ctx.textAlign = 'left';
  ctx.fillText('\u2191/W: Throttle    \u2193/S: Brake', 10, H - 28);
  ctx.fillText('\u2190/A | \u2192/D: Change Lane     SPACE: Restart', 10, H - 12);
}

// -- Draw: Countdown --------------------------------------
function drawCountdown() {
  ctx.fillStyle = 'rgba(0,0,0,0.68)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';

  ctx.fillStyle = '#66FF66';
  ctx.font = 'bold 34px Arial Black, Arial';
  ctx.fillText('CARNIVORE CIRCUIT', W / 2, H / 2 - 92);

  ctx.fillStyle = '#aaa';
  ctx.font = '16px Arial';
  ctx.fillText(`5 rivals  \u2022  ${N_LAPS} laps  \u2022  Watch the flytraps!`, W / 2, H / 2 - 62);

  ctx.fillStyle = '#FFCC00';
  ctx.font = 'bold 100px Arial Black, Arial';
  ctx.fillText(countdown > 0 ? String(countdown) : 'GO!', W / 2, H / 2 + 38);

  ctx.fillStyle = '#888';
  ctx.font = '15px Arial';
  ctx.fillText('Arrow keys or WASD to drive', W / 2, H / 2 + 82);
}

// -- Draw: Finish Screen ----------------------------------
function drawFinishScreen() {
  ctx.fillStyle = 'rgba(0,0,0,0.80)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';

  const won = winnerName === 'YOU';
  ctx.fillStyle = won ? '#FFCC00' : '#FF4444';
  ctx.font = 'bold 68px Arial Black, Arial';
  ctx.fillText(won ? 'YOU WIN!' : winnerName + ' WINS!', W / 2, H / 2 - 55);

  ctx.fillStyle = '#fff';
  ctx.font = '24px Arial';
  ctx.fillText(
    `Your finish: ${ordinal(getPos())}   \u2022   Race time: ${finishTime.toFixed(1)}s`,
    W / 2, H / 2 + 15
  );

  ctx.fillStyle = '#888';
  ctx.font = '18px Arial';
  ctx.fillText('Press SPACE to race again', W / 2, H / 2 + 62);
}

// -- Update -----------------------------------------------
function update(dt) {
  if (gameState === 'countdown') {
    cdTimer += dt;
    if (cdTimer >= 1) { cdTimer -= 1; countdown--; }
    if (countdown < 0) { gameState = 'racing'; }
    return;
  }

  if (gameState === 'finished') {
    if (K['Space']) resetGame();
    return;
  }

  raceTime += dt;
  const now = performance.now();

  // Player throttle / brake (capped while grabbed)
  const grabbed = P.grabTimer > 0;
  if      (K['ArrowUp']   || K['KeyW']) P.speed = Math.min(P.maxSpd, P.speed + P.accel);
  else if (K['ArrowDown'] || K['KeyS']) P.speed = Math.max(0, P.speed - P.brake);
  else                                   P.speed = Math.max(0, P.speed - P.friction);

  if (grabbed) {
    P.speed = Math.min(P.speed, 2.2);
    P.grabTimer -= dt;
  }

  if (now - lastLaneTm > 270) {
    if      (K['ArrowLeft']  || K['KeyA']) { P.lane = Math.max(0, P.lane - 1);           lastLaneTm = now; }
    else if (K['ArrowRight'] || K['KeyD']) { P.lane = Math.min(N_LANES - 1, P.lane + 1); lastLaneTm = now; }
  }

  P.dist  += P.speed;
  scrollX += P.speed * ROAD_RATE;

  // Cannonball spawn
  cannonSpawnTimer -= dt;
  if (cannonSpawnTimer <= 0) {
    cannonSpawnTimer = CANNON_INTERVAL + Math.random() * 1.8;
    spawnCannonball();
    if (Math.random() > 0.6) {
      setTimeout(() => { if (gameState === 'racing') spawnCannonball(); }, 500);
    }
  }

  cannonballs = cannonballs.filter(b => b.x > -80 && b.x < W + 80);
  cannonballs.forEach(b => {
    b.x += b.vx * dt;

    if (cannonHitTimer <= 0 && Math.abs(b.x - PLAYER_X) < 24 && P.lane === b.lane) {
      P.speed        = Math.max(0, P.speed - 7);
      cannonHitTimer = 0.7;
    }

    ais.forEach(ai => {
      const aiSX = PLAYER_X + (totalDst(ai) - totalDst(P)) * POS_SCALE;
      if (Math.abs(b.x - aiSX) < 24 && ai.lane === b.lane) {
        ai.speed = Math.max(3, ai.speed - 3);
      }
    });
  });

  if (cannonHitTimer > 0) cannonHitTimer -= dt;
  cannonPuffs = cannonPuffs.filter(p => p.timer > 0);
  cannonPuffs.forEach(p => { p.timer -= dt; });

  // Flytrap update + player collision
  TRAPS.forEach(trap => {
    if (trap.snapTimer > 0) trap.snapTimer -= dt;
  });

  if (P.grabTimer <= 0) {
    for (const trap of TRAPS) {
      if (trap.snapTimer > 0.35) continue;   // already closed/held
      let hit = false;
      for (let lapOff = -1; lapOff <= 1; lapOff++) {
        const d  = trap.lapDist + lapOff * TRACK_LEN - P.dist;
        const sx = PLAYER_X + d * POS_SCALE;
        if (Math.abs(sx - PLAYER_X) < 20 && P.lane === trap.lane) {
          hit = true; break;
        }
      }
      if (hit) {
        trap.snapTimer = 1.4;
        P.grabTimer = 0.9;
        P.speed = Math.min(P.speed, 1.5);
        break;
      }
    }
  }

  // AI flytrap collision (less severe)
  ais.forEach(ai => {
    if (ai.grabTimer > 0) { ai.grabTimer -= dt; return; }
    const aiLapDist = ((ai.dist % TRACK_LEN) + TRACK_LEN) % TRACK_LEN;
    for (const trap of TRAPS) {
      if (trap.snapTimer > 0.35) continue;
      if (Math.abs(aiLapDist - trap.lapDist) < 8 && ai.lane === trap.lane) {
        trap.snapTimer = 1.4;
        ai.grabTimer = 0.6;
        ai.speed = Math.max(2, ai.speed - 5);
        break;
      }
    }
  });

  // Player lap check
  if (P.dist >= TRACK_LEN) {
    P.dist -= TRACK_LEN;
    P.lap++;
    if (P.lap > N_LAPS) tryFinish(P, 'YOU');
  }

  // AI update
  ais.forEach((ai, idx) => {
    if (ai.finished) return;

    const pd  = totalDst(P);
    const aid = totalDst(ai);
    let spd = ai.baseSpd + Math.sin(raceTime * 0.35 + idx * 1.57) * 1.6;
    if (aid > pd + 2000) spd *= 0.90;
    if (aid < pd - 2500) spd *= 1.18;

    if (ai.grabTimer > 0) spd = Math.min(spd, 2);
    ai.speed = clamp(spd, 2, 17);
    ai.dist += ai.speed;

    ai.laneTm -= dt;
    if (ai.laneTm <= 0) {
      ai.laneTm = 1.8 + Math.random() * 3.5;
      const free = [0, 1, 2, 3].filter(l => l !== P.lane || Math.random() > 0.35);
      ai.lane = free[Math.floor(Math.random() * free.length)];
    }

    const aiSX = PLAYER_X + (totalDst(ai) - totalDst(P)) * POS_SCALE;
    if (Math.abs(aiSX - PLAYER_X) < CAR_W * 0.8 && ai.lane === P.lane) {
      P.speed  = Math.max(0, P.speed - 2.5);
      ai.lane  = (ai.lane + 1 + Math.floor(Math.random() * 3)) % N_LANES;
    }

    if (ai.dist >= TRACK_LEN) {
      ai.dist -= TRACK_LEN;
      ai.lap++;
      if (ai.lap > N_LAPS) tryFinish(ai, ai.name);
    }
  });
}

// -- Render -----------------------------------------------
function render() {
  ctx.clearRect(0, 0, W, H);
  drawBg();
  drawScenery();
  drawRoad();
  drawTraps();
  drawFinishLine();

  if (P.grabTimer > 0) {
    ctx.fillStyle = `rgba(80, 200, 50, ${P.grabTimer * 0.35})`;
    ctx.fillRect(0, 0, W, H);
  }
  if (cannonHitTimer > 0) {
    ctx.fillStyle = `rgba(255, 140, 0, ${cannonHitTimer * 0.38})`;
    ctx.fillRect(0, 0, W, H);
  }

  const playerTD = totalDst(P);
  const cars = [
    { x: PLAYER_X, y: laneY(P.lane), color: P.color, isPlayer: true,  name: P.name, num: P.num, lane: P.lane, grabbed: P.grabTimer > 0 },
    ...ais.map(ai => ({
      x:        PLAYER_X + (totalDst(ai) - playerTD) * POS_SCALE,
      y:        laneY(ai.lane),
      color:    ai.color,
      isPlayer: false,
      name:     ai.name,
      num:      ai.num,
      lane:     ai.lane,
      grabbed:  ai.grabTimer > 0
    }))
  ].filter(c => c.x > -CAR_W && c.x < W + CAR_W);

  cars.sort((a, b) => a.lane - b.lane);
  cars.forEach(c => drawCar(c.x, c.y, c.color, c.isPlayer, c.name, c.num, c.grabbed));

  drawCannonballs();

  drawHUD();
  if (gameState === 'countdown') drawCountdown();
  if (gameState === 'finished')  drawFinishScreen();
}

// -- Reset ------------------------------------------------
function resetGame() {
  Object.assign(P, { lane: 1, speed: 0, dist: 0, lap: 1, finished: false, grabTimer: 0 });
  initAIs();
  TRAPS.forEach(t => { t.snapTimer = 0; });
  scrollX = 0; raceTime = 0; countdown = 3; cdTimer = 0;
  winnerName = ''; finishTime = 0; lastLaneTm = 0;
  cannonballs = []; cannonPuffs = []; cannonSpawnTimer = 3.0; cannonHitTimer = 0;
  gameState = 'countdown';
}

// -- Game Loop --------------------------------------------
let lastT = null;
function loop(ts) {
  if (!lastT) lastT = ts;
  const dt = Math.min((ts - lastT) / 1000, 0.05);
  lastT = ts;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
<script src="gamepad.js"></script>
<script>
setupGamepad({
  mirrorSingle: true,
  players: [{
    up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight',
    a: 'Space', b: 'Space', start: 'Space'
  }]
});
</script>
